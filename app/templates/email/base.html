<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#F7F8FA;font-family:Poppins,Segoe UI,Arial,sans-serif;color:#1A1F2B;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F8FA;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#0B2A4A;padding:20px 28px;">
                <span style="color:#FFFFFF;font-size:18px;font-weight:600;letter-spacing:0.3px;">Nikee</span>
                <span style="color:#C9A227;font-size:18px;font-weight:600;letter-spacing:0.3px;">Migrations</span>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;font-size:15px;line-height:1.6;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 24px;border-top:1px solid #EEF0F3;font-size:12px;color:#6B7280;">
                &copy; {{ year }} {{ app_name }} &middot;
                <a href="{{ website_url }}" style="color:#1E4FA3;text-decoration:none;">nikeemigration.com</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
