# Local stack: PostgreSQL, Redis, Mailpit (catches emails), the API and the arq worker.
#
#   cd backend
#   docker compose up --build
#
# API:     http://localhost:8000/docs
# Emails:  http://localhost:8025  (Mailpit inbox — OTP codes, invites, meeting invites)
#
# Secrets are read from backend/.env (JWT_SECRET, SEED_ADMIN_PASSWORD, SEED_DEMO_PASSWORD).
# The database here is separate from your local PostgreSQL install (it's on port 5433).

name: nikee-migrations

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://nikee:${POSTGRES_PASSWORD:-nikee-dev-password}@db:5432/nikee_migrations
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
  BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Colombo}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@nikeemigration.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in backend/.env}
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
  EMAIL_BACKEND: smtp
  EMAIL_FROM: ${EMAIL_FROM:-Nikee Migrations <no-reply@nikeemigration.com>}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USE_TLS: "false"
  STORAGE_BACKEND: local
  LOCAL_STORAGE_DIR: /app/storage

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nikee_migrations
      POSTGRES_USER: nikee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nikee-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikee -d nikee_migrations"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  api:
    build: .
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
      RUN_SEED: "1"
    volumes:
      - storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build: .
    command: ["arq", "app.workers.WorkerSettings"]
    environment:
      <<: *app-env
    volumes:
      - storage:/app/storage
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storage:
